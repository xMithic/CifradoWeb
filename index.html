
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifrado de Vigenère</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Inconsolata:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff60b4;
    --blue:#72efff;
    --gold:#ffd700;
    --bg-primary:#111;
    --text-primary:#f9f9f9;
    --text-glow: rgba(255,255,255,0.6);
    --text-glow-soft: rgba(255,255,255,0.3);
    --font-retro:'VT323', monospace;
    --font-mono:'Inconsolata', monospace;
    --border-radius-sm:4px;
    --border-radius-md:10px;
    --border-radius-lg:16px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body{
    height:100%;
    margin:0;
    padding:0;
  }

  body{
    background-color:var(--bg-primary);
    color:var(--text-primary);
    font-family:var(--font-mono);
    min-height:100vh;
    min-height:100dvh;
    position:relative;
    overflow-x:hidden;
    padding:30px 20px 60px;
  }

  /* === CRT scanlines === */
  body::after{
    content:"";
    position:fixed;
    top:0; left:0; width:100%; height:100%;
    background:
      repeating-linear-gradient(to bottom, transparent 0px, transparent 1px, rgba(0,0,0,0.15) 1px, rgba(0,0,0,0.15) 2px),
      repeating-linear-gradient(to right, rgba(255,0,0,0.03) 0px, rgba(0,255,0,0.02) 1px, rgba(0,0,255,0.03) 2px, transparent 3px);
    pointer-events:none;
    z-index:9999;
    animation:crtPulse 6s ease-in-out infinite alternate;
  }
  @keyframes crtPulse{ 0%,100%{opacity:.5;} 50%{opacity:.7;} }

  /* === Viñeta / cristal CRT === */
  body::before{
    content:"";
    position:fixed;
    top:0; left:0; width:100vw; height:100vh;
    pointer-events:none;
    z-index:9998;
    box-shadow:
      inset 0 0 18vmin rgba(0,0,0,0.9),
      inset 0 0 35vmin rgba(0,0,0,0.45),
      inset 0 0 3px 1px rgba(255,255,255,0.05);
    background:
      radial-gradient(ellipse 80% 30% at 50% 8%, rgba(255,255,255,0.08) 0%, transparent 60%),
      radial-gradient(circle at 50% 50%, transparent 35%, rgba(0,0,0,0.12) 55%, rgba(0,0,0,0.5) 80%, rgba(0,0,0,0.8) 100%);
  }

  /* === Aura ambiental === */
  .ambient-glow{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:140vw; height:140vh;
    background:
      radial-gradient(ellipse 60% 50% at 30% 40%, rgba(114,239,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 70% 60%, rgba(255,96,180,0.06) 0%, transparent 60%);
    pointer-events:none;
    z-index:0;
    animation:ambientBreathe 10s ease-in-out infinite alternate;
  }
  @keyframes ambientBreathe{
    0%{opacity:.3; transform:translate(-50%,-50%) scale(1) rotate(0deg);}
    50%{opacity:.7; transform:translate(-50%,-50%) scale(1.05) rotate(1deg);}
    100%{opacity:.5; transform:translate(-50%,-50%) scale(.98) rotate(-1deg);}
  }

  /* === Estrellas titilantes decorativas === */
  .star{
    position:fixed;
    background:#fff;
    border-radius:50%;
    pointer-events:none;
    z-index:1;
    animation:starTwinkle var(--star-speed,3s) ease-in-out infinite alternate;
  }
  @keyframes starTwinkle{
    0%{opacity:.1; transform:scale(.8);}
    50%{opacity:.9; transform:scale(1.2);}
    100%{opacity:.2; transform:scale(.9);}
  }

  h1{
    position:relative;
    color:#fff;
    text-align:center;
    letter-spacing:.03em;
    font:44px var(--font-retro);
    margin:0 auto 4px;
    text-shadow:0 0 4px var(--text-glow), 0 0 10px var(--text-glow-soft), 0 0 20px rgba(114,239,255,0.15);
    animation:textBreathe 4s ease-in-out infinite alternate;
    z-index:2;
  }
  @keyframes textBreathe{
    from{ text-shadow:0 0 4px var(--text-glow), 0 0 10px var(--text-glow-soft); transform:scale(1); }
    to{ text-shadow:0 0 8px var(--text-glow), 0 0 15px var(--text-glow-soft), 0 0 25px rgba(114,239,255,0.35); transform:scale(1.01); }
  }

  p.subtitle{
    text-align:center;
    color:rgba(249,249,249,0.55);
    font:22px var(--font-retro);
    letter-spacing:.02em;
    margin-top:0;
    margin-bottom:34px;
    position:relative;
    z-index:2;
  }

  .layout{
    display:flex;
    flex-wrap:wrap-reverse;
    gap:26px;
    max-width:1300px;
    margin:0 auto;
    align-items:flex-start;
    position:relative;
    z-index:2;
  }

  .panel{
    background:rgba(17,17,17,0.75);
    border:1px solid rgba(114,239,255,0.25);
    border-radius:var(--border-radius-lg);
    padding:24px;
    backdrop-filter:blur(6px);
    box-shadow:
      0 0 20px rgba(0,0,0,0.6),
      inset 0 0 30px rgba(114,239,255,0.03);
  }

  /* Tabla a la izquierda */
  .table-panel{
    flex:2 1 620px;
    overflow:auto;
    max-height:80vh;
  }
  .table-panel::-webkit-scrollbar{ width:6px; height:6px; }
  .table-panel::-webkit-scrollbar-track{ background:rgba(255,255,255,0.03); border-radius:10px; }
  .table-panel::-webkit-scrollbar-thumb{
    background:linear-gradient(to bottom, rgba(114,239,255,0.4), rgba(255,96,180,0.4));
    border-radius:10px;
  }

  /* Formulario a la derecha */
  .form-panel{
    flex:1 1 300px;
    position:sticky;
    top:20px;
  }

  label{
    display:block;
    margin-top:16px;
    margin-bottom:8px;
    font:22px var(--font-retro);
    letter-spacing:.05em;
    color:var(--blue);
    text-shadow:0 0 6px rgba(114,239,255,0.5);
  }

  input[type=text]{
    width:100%;
    padding:12px 14px;
    border-radius:var(--border-radius-sm);
    border:1px solid rgba(255,255,255,0.15);
    background:#0a0a0a;
    color:var(--text-primary);
    font:20px var(--font-mono);
    outline:none;
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  input[type=text]:focus{
    border-color:var(--blue);
    box-shadow:0 0 10px rgba(114,239,255,0.5);
  }

  button{
    margin-top:22px;
    width:100%;
    padding:12px;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:var(--border-radius-sm);
    background:transparent;
    color:var(--text-primary);
    font:26px var(--font-retro);
    letter-spacing:.08em;
    cursor:pointer;
    position:relative;
    text-shadow:0 0 4px rgba(255,255,255,0.5), 0 0 8px rgba(255,255,255,0.2);
    transition:transform .25s cubic-bezier(.22,1,.36,1), text-shadow .3s ease, border-color .3s ease;
  }
  button:hover{
    transform:scale(1.03) translateX(2px);
    border-color:var(--blue);
    text-shadow:0 0 8px rgba(255,255,255,0.8), 0 0 20px rgba(114,239,255,0.5), 0 0 40px rgba(114,239,255,0.15);
  }
  button:active{
    transform:scale(.96);
    text-shadow:2px 0 rgba(255,0,0,0.8), -2px 0 rgba(0,255,255,0.8);
  }
  button:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
  }

  .result-box{
    margin-top:14px;
    padding:16px;
    border-radius:var(--border-radius-sm);
    background:#0a0a0a;
    border:1px dashed var(--gold);
    min-height:52px;
    font:26px var(--font-retro);
    letter-spacing:2px;
    word-break:break-all;
    color:var(--gold);
    text-shadow:0 0 4px rgba(255,215,0,0.4), 0 0 10px rgba(255,215,0,0.2);
  }

  table{
    border-collapse:collapse;
    font:16px var(--font-retro);
  }
  th, td{
    width:30px;
    height:30px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.1);
    transition:background .25s, color .25s, transform .25s, text-shadow .25s;
  }
  thead th{
    position:sticky;
    top:0;
    background:#161616;
    color:var(--blue);
    text-shadow:0 0 6px rgba(114,239,255,0.5);
    z-index:2;
  }
  tbody th{
    position:sticky;
    left:0;
    background:#161616;
    color:var(--blue);
    text-shadow:0 0 6px rgba(114,239,255,0.5);
    z-index:1;
  }
  thead th:first-child, tbody th{ z-index:3; }

  td.highlight{
    background:var(--pink);
    color:#111;
    font-weight:700;
    transform:scale(1.2);
    box-shadow:0 0 14px var(--pink), 0 0 26px rgba(255,96,180,0.5);
  }
  td.row-key{
    background:rgba(114,239,255,0.12);
    color:var(--blue);
  }
  td.col-plain{
    background:rgba(255,215,0,0.1);
    color:var(--gold);
  }

  .footer-note{
    text-align:center;
    margin-top:34px;
    font:18px var(--font-retro);
    color:rgba(255,255,255,0.4);
    position:relative;
    z-index:2;
  }

  @media screen and (max-width:768px){
    h1{ font-size:32px; }
    p.subtitle{ font-size:18px; }
    body::after, body::before{ opacity:.6; }
    .layout{ flex-direction:column-reverse; }
    .form-panel{ position:static; }
  }
</style>
</head>
<body>

<div class="ambient-glow"></div>
<div class="star" style="top:10%; left:15%; width:2px; height:2px; --star-speed:3.4s;"></div>
<div class="star" style="top:20%; left:80%; width:3px; height:3px; --star-speed:2.6s;"></div>
<div class="star" style="top:60%; left:5%; width:2px; height:2px; --star-speed:4s;"></div>
<div class="star" style="top:75%; left:90%; width:2px; height:2px; --star-speed:3s;"></div>
<div class="star" style="top:40%; left:50%; width:2px; height:2px; --star-speed:3.8s;"></div>
<div class="star" style="top:88%; left:30%; width:3px; height:3px; --star-speed:2.9s;"></div>

<h1>Cifrado de Vigenère</h1>
<p class="subtitle">Tabula recta interactiva — ingresa tu contraseña y la palabra clave</p>

<div class="layout">

  <div class="panel table-panel">
    <table id="vigenereTable"></table>
  </div>

  <div class="panel form-panel">
    <label for="password">Contraseña a cifrar</label>
    <input type="text" id="password" placeholder="Ej: MiClaveSecreta">

    <label for="keyword">Palabra clave</label>
    <input type="text" id="keyword" placeholder="Ej: LLAVE">

    <button id="btnCifrar">Cifrar</button>

    <label>Cifrado final</label>
    <div class="result-box" id="resultado">—</div>
  </div>

</div>

<p class="footer-note">Fila = letra de la palabra clave · Columna = letra de la contraseña · Intersección = carácter cifrado</p>
